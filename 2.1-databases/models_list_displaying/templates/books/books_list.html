{% extends 'base.html' %}

{% block title %}Все книги{% endblock %}

{% block content %}
    <h1 class="mb-4">📚 Каталог книг</h1>
    <div class="row">
        {% for book in books %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.name }}</h5>
                        <p class="card-text">
                            <strong>Автор:</strong> {{ book.author }}<br>
                            <strong>Дата публикации:</strong> {{ book.pub_date|date:"Y-m-d" }}
                        </p>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Книг пока нет.</p>
        {% endfor %}
    </div>
{% endblock %}
